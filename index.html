  <style>
    body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
    .gold { color: #C6A75E; }
    .gold-bg { background-color: #C6A75E; }
    .royal-blue { color: #0033A0; }
    .royal-bg { background-color: #0033A0; }
    
    .hero-container { 
        position: relative;
        min-height: 80vh;
        display: flex;
        align-items: center;
        overflow: hidden;
        background: #0033A0; 
    }

    .hero-video {
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        object-fit: cover;
        z-index: 1;
    }

    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(0, 51, 160, 0.70) 0%, rgba(0, 51, 160, 0.80) 100%);
        z-index: 2;
    }

    .hero-content { position: relative; z-index: 3; width: 100%; }

    .faded-section { background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); }
    .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); border: 1px solid rgba(0, 51, 160, 0.1); }
    
    @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .logo-track { display: flex; width: calc(250px * 12); animation: scroll 40s linear infinite; }
    .logo-track:hover { animation-play-state: paused; }
    
    .input-field { background-color: #f8fafc; border: 1px solid #e2e8f0; transition: all 0.3s ease; }
    .input-field:focus { border-color: #0033A0; background-color: #fff; box-shadow: 0 0 0 4px rgba(0, 51, 160, 0.05); }
  </style>
</head>
